<svg width="920" height="160" viewBox="0 0 920 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Signal panel showing status online">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0D12"/>
      <stop offset="1" stop-color="#10131B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA8FF"/>
      <stop offset="1" stop-color="#4FD1C5"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FA8FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8FA8FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8FA8FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="920" height="160" rx="14"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="920" height="160" rx="14" fill="url(#bg)" stroke="#1D2330" stroke-width="1"/>

  <g clip-path="url(#clip)">
    <rect x="-260" y="0" width="260" height="160" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 1180 0; 1180 0" keyTimes="0; 0.65; 1"
        dur="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="34" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#5B6479">IDENTITY.TERMINAL</text>
  <text x="34" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E7EAF2">[NAME] // [ROLE]</text>

  <circle cx="36" cy="102" r="4" fill="#4FD1C5">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#8B93A7">STATUS: ONLINE</text>

  <text x="34" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#5B6479">BUILDING: [CURRENT PROJECT]  ·  EXPLORING: [CURRENT FOCUS]</text>

  <!-- signal bars -->
  <g transform="translate(600,0)">
    <rect x="0"   y="118" width="7" height="16" rx="2" fill="url(#bar)"><animate attributeName="height" values="16;54;12;40;16" dur="2.1s" begin="0s"   repeatCount="indefinite"/><animate attributeName="y" values="118;80;122;94;118" dur="2.1s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="16"  y="110" width="7" height="24" rx="2" fill="url(#bar)"><animate attributeName="height" values="24;10;46;20;24" dur="2.3s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y" values="110;124;88;114;110" dur="2.3s" begin="0.15s" repeatCount="indefinite"/></rect>
    <rect x="32"  y="98"  width="7" height="36" rx="2" fill="url(#bar)"><animate attributeName="height" values="36;58;18;44;36" dur="1.9s" begin="0.3s"  repeatCount="indefinite"/><animate attributeName="y" values="98;76;116;90;98" dur="1.9s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="48"  y="104" width="7" height="30" rx="2" fill="url(#bar)"><animate attributeName="height" values="30;14;50;26;30" dur="2.4s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="y" values="104;120;84;108;104" dur="2.4s" begin="0.45s" repeatCount="indefinite"/></rect>
    <rect x="64"  y="90"  width="7" height="44" rx="2" fill="url(#bar)"><animate attributeName="height" values="44;20;56;32;44" dur="2s"   begin="0.6s"  repeatCount="indefinite"/><animate attributeName="y" values="90;114;78;102;90" dur="2s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="80"  y="112" width="7" height="22" rx="2" fill="url(#bar)"><animate attributeName="height" values="22;48;14;38;22" dur="2.2s" begin="0.75s" repeatCount="indefinite"/><animate attributeName="y" values="112;86;120;96;112" dur="2.2s" begin="0.75s" repeatCount="indefinite"/></rect>
    <rect x="96"  y="100" width="7" height="34" rx="2" fill="url(#bar)"><animate attributeName="height" values="34;56;16;42;34" dur="1.85s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="100;78;118;92;100" dur="1.85s" begin="0.9s" repeatCount="indefinite"/></rect>
    <rect x="112" y="106" width="7" height="28" rx="2" fill="url(#bar)"><animate attributeName="height" values="28;12;48;24;28" dur="2.15s" begin="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="106;122;86;110;106" dur="2.15s" begin="1.05s" repeatCount="indefinite"/></rect>
    <rect x="128" y="94"  width="7" height="40" rx="2" fill="url(#bar)"><animate attributeName="height" values="40;60;20;46;40" dur="2.35s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="94;74;114;88;94" dur="2.35s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="144" y="108" width="7" height="26" rx="2" fill="url(#bar)"><animate attributeName="height" values="26;46;12;36;26" dur="1.95s" begin="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="108;88;122;98;108" dur="1.95s" begin="1.35s" repeatCount="indefinite"/></rect>
  </g>

  <text x="792" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#5B6479">SIGNAL</text>
</svg>
